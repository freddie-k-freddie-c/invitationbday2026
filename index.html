<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David's 30th</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #f7f5f0;
    --line: #cfc9bd;
    --muted: #6b665c;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Times New Roman", Times, Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    line-height: 1.5;
  }

  .card {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  .eyebrow {
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 1.75rem;
  }

  h1 {
    font-size: clamp(2.6rem, 9vw, 3.6rem);
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .age {
    font-style: normal;
    display: block;
    font-size: clamp(3.6rem, 14vw, 5.2rem);
    letter-spacing: 0.02em;
    margin-top: 0.25rem;
  }

  .rule {
    width: 44px;
    height: 1px;
    background: var(--line);
    border: 0;
    margin: 2rem auto;
  }

  .details {
    font-size: 1.15rem;
  }

  .details p { margin: 0.35rem 0; }

  .details .sub {
    color: var(--muted);
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }

  .when {
    margin-top: 1.25rem;
    font-size: 1.25rem;
  }

  /* RSVP */
  .rsvp {
    margin-top: 2.5rem;
  }

  .rsvp-label {
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .fields {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    align-items: center;
  }

  .fields:empty { margin: 0; }

  .name-field {
    width: 100%;
    max-width: 260px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-family: inherit;
    font-size: 1.1rem;
    text-align: center;
    padding: 0.4rem 0;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .name-field:focus { border-color: var(--ink); }
  .name-field::placeholder { color: var(--muted); font-style: italic; }

  .add-btn {
    margin-top: 1.25rem;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }

  .add-btn:hover { border-color: var(--ink); background: rgba(0,0,0,0.03); }
  .add-btn:active { transform: scale(0.94); }
  .add-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .add-btn[hidden] { display: none; }

  .confirm-btn {
    margin-top: 1.5rem;
    background: var(--ink);
    color: var(--paper);
    border: 0;
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.8rem 2.2rem;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .confirm-btn:hover { opacity: 0.85; }
  .confirm-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .confirm-btn[hidden] { display: none; }

  .thanks {
    margin-top: 1.5rem;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ink);
  }
  .thanks[hidden] { display: none; }

  .reaction { margin-top: 1.25rem; }
  .reaction[hidden] { display: none; }

  .reaction-emoji {
    display: inline-block;
    font-size: 2.6rem;
    line-height: 1;
    filter: grayscale(1) contrast(1.05);
    animation: eyebrow 0.35s ease;
  }

  .reaction-note {
    margin: 0.4rem 0 0;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--muted);
  }

  @keyframes eyebrow {
    0%   { transform: scale(0.6) rotate(-6deg); opacity: 0; }
    70%  { transform: scale(1.12) rotate(3deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">You're invited</p>

    <h1>David turns<span class="age">30</span></h1>

    <hr class="rule">

    <div class="details">
      <p>Dinner &amp; Karaoke</p>
      <p class="sub">Dress code: Warm & Cozy</p>
    </div>

    <p class="when">29 August &middot; 19:00</p>

    <hr class="rule">

    <section class="rsvp" aria-labelledby="rsvp-label">
      <p class="rsvp-label" id="rsvp-label">RSVP</p>

      <div class="fields" id="fields" aria-live="polite"></div>

      <button type="button" class="add-btn" id="addBtn" aria-label="Add a name">+</button>

      <div class="reaction" id="reaction" hidden>
        <span class="reaction-emoji" aria-hidden="true">&#129320;</span>
        <p class="reaction-note">Two max. Nice try.</p>
      </div>

      <button type="button" class="confirm-btn" id="confirmBtn" hidden>Send RSVP on WhatsApp</button>

      <p class="thanks" id="thanks" hidden>See you there.</p>
    </section>
  </main>

  <script>
    (function () {
      // ---- SET THIS: David's WhatsApp number, international format, digits only.
      // No "+", no spaces. Example for +1 (555) 123-4567  ->  '15551234567'
      var WHATSAPP_NUMBER = '19498780185';

      var MAX = 2;
      var fields = document.getElementById('fields');
      var addBtn = document.getElementById('addBtn');
      var confirmBtn = document.getElementById('confirmBtn');
      var thanks = document.getElementById('thanks');
      var reaction = document.getElementById('reaction');
      var reactionEmoji = reaction.querySelector('.reaction-emoji');

      function count() {
        return fields.querySelectorAll('.name-field').length;
      }

      function addField() {
        if (count() >= MAX) {
          reaction.hidden = false;
          reactionEmoji.style.animation = 'none';
          void reactionEmoji.offsetWidth;
          reactionEmoji.style.animation = '';
          return;
        }

        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'name-field';
        input.placeholder = 'First name';
        input.setAttribute('aria-label', 'First name');
        fields.appendChild(input);
        input.focus();

        confirmBtn.hidden = false;
      }

      addBtn.addEventListener('click', addField);

      confirmBtn.addEventListener('click', function () {
        var names = Array.prototype.map
          .call(fields.querySelectorAll('.name-field'), function (el) {
            return el.value.trim();
          })
          .filter(Boolean);

        if (names.length === 0) {
          fields.querySelector('.name-field').focus();
          return;
        }

        var who = names.length === 1
          ? names[0]
          : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];

        var message = who + (names.length === 1 ? ' is' : ' are')
          + " coming to David's 30th on 29 Aug. See you there!";

        var url = 'https://wa.me/' + WHATSAPP_NUMBER
          + '?text=' + encodeURIComponent(message);

        window.open(url, '_blank');

        var first = names[0].split(' ')[0];
        thanks.textContent = names.length === 1
          ? 'See you there, ' + first + '.'
          : 'See you there \u2014 all ' + names.length + ' of you.';

        fields.querySelectorAll('.name-field').forEach(function (el) {
          el.disabled = true;
        });
        addBtn.hidden = true;
        confirmBtn.hidden = true;
        reaction.hidden = true;
        thanks.hidden = false;
      });
    })();
  </script>
</body>
</html>
