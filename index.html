<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David's 30th Birthday</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #141414;
            --text-color: #f2f2f2;
            --muted-color: #999999;
            --border-color: #262626;
            --font-serif: 'Times New Roman', Times, Baskerville, Georgia, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-serif);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 48px 32px;
            text-align: center;
        }

        .tag {
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--muted-color);
            margin-bottom: 16px;
            font-style: italic;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 28px;
            line-height: 1.2;
        }

        .details {
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 24px 0;
            margin-bottom: 32px;
        }

        .detail-item {
            font-size: 1.25rem;
            margin: 6px 0;
            letter-spacing: 0.5px;
        }

        .location-link {
            display: inline-block;
            margin-top: 14px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-style: italic;
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 2px;
            transition: opacity 0.2s;
        }

        .location-link:hover {
            opacity: 0.6;
        }

        .countdown-title {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted-color);
            margin-bottom: 16px;
        }

        .timer {
            display: flex;
            justify-content: space-between;
            margin-bottom: 36px;
        }

        .time-box {
            flex: 1;
        }

        .number {
            font-size: 1.75rem;
            font-weight: 400;
        }

        .label {
            font-size: 0.65rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        /* Dynamic RSVP Form Styling */
        .rsvp-section {
            border-top: 1px solid var(--border-color);
            padding-top: 28px;
            text-align: left;
        }

        .counter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .counter-label {
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted-color);
        }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-counter {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 32px;
            height: 32px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-counter:hover {
            border-color: var(--text-color);
        }

        .guest-count-num {
            font-size: 1.1rem;
            width: 16px;
            text-align: center;
        }

        .inputs-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .name-input {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .name-input:focus {
            border-color: var(--text-color);
        }

        .rsvp-btn {
            display: block;
            width: 100%;
            background-color: var(--text-color);
            color: var(--bg-color);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 16px 0;
            text-align: center;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .rsvp-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tag">You are invited</div>
    <h1>David's 30th</h1>

    <div class="details">
        <div class="detail-item">August 29</div>
        <div class="detail-item">19:00</div>
        <!-- Replace href with your 2GIS link -->
        <a href="https://2gis.kz" target="_blank" class="location-link">Open location in 2GIS &#8594;</a>
    </div>

    <div class="countdown-title">Time Until Event</div>
    <div class="timer">
        <div class="time-box">
            <div id="days" class="number">00</div>
            <div class="label">Days</div>
        </div>
        <div class="time-box">
            <div id="hours" class="number">00</div>
            <div class="label">Hours</div>
        </div>
        <div class="time-box">
            <div id="mins" class="number">00</div>
            <div class="label">Mins</div>
        </div>
        <div class="time-box">
            <div id="secs" class="number">00</div>
            <div class="label">Secs</div>
        </div>
    </div>

    <!-- Interactive RSVP Section -->
    <div class="rsvp-section">
        <div class="counter-row">
            <span class="counter-label">Guests</span>
            <div class="counter-controls">
                <button type="button" class="btn-counter" onclick="adjustGuests(-1)">&#8722;</button>
                <span class="guest-count-num" id="guestCount">1</span>
                <button type="button" class="btn-counter" onclick="adjustGuests(1)">&#43;</button>
            </div>
        </div>

        <div class="inputs-container" id="inputsContainer">
            <input type="text" class="name-input" placeholder="First Name" id="guest1" required>
        </div>

        <a id="whatsappBtn" href="#" class="rsvp-btn" onclick="sendRSVP(event)">
            RSVP VIA WHATSAPP
        </a>
    </div>
</div>

<script>
    // Countdown Timer Logic
    const targetDate = new Date("2026-08-29T19:00:00+05:00").getTime();

    function updateTimer() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference > 0) {
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("mins").innerText = String(minutes).padStart(2, '0');
            document.getElementById("secs").innerText = String(seconds).padStart(2, '0');
        } else {
            document.getElementById("days").innerText = "00";
            document.getElementById("hours").innerText = "00";
            document.getElementById("mins").innerText = "00";
            document.getElementById("secs").innerText = "00";
        }
    }
    updateTimer();
    setInterval(updateTimer, 1000);

    // Guest Counter Logic (Max: 2)
    let currentGuests = 1;
    const maxGuests = 2;
    const phoneNum = "1234567890"; // REPLACE WITH YOUR PHONE NUMBER

    function adjustGuests(change) {
        const newCount = currentGuests + change;
        if (newCount >= 1 && newCount <= maxGuests) {
            currentGuests = newCount;
            document.getElementById("guestCount").innerText = currentGuests;
            renderInputs();
        }
    }

    function renderInputs() {
        const container = document.getElementById("inputsContainer");
        const existingVal1 = document.getElementById("guest1") ? document.getElementById("guest1").value : "";
        const existingVal2 = document.getElementById("guest2") ? document.getElementById("guest2").value : "";

        let html = `<input type="text" class="name-input" placeholder="Your First Name" id="guest1" value="${existingVal1}">`;
        
        if (currentGuests === 2) {
            html += `<input type="text" class="name-input" placeholder="Guest 2 First Name" id="guest2" value="${existingVal2}">`;
        }
        
        container.innerHTML = html;
    }

    function sendRSVP(e) {
        e.preventDefault();
        const name1 = document.getElementById("guest1").value.trim();
        
        if (!name1) {
            alert("Please enter your name.");
            return;
        }

        let message = `Hi David, ${name1}`;
        if (currentGuests === 2) {
            const name2 = document.getElementById("guest2") ? document.getElementById("guest2").value.trim() : "";
            if (name2) {
                message += ` and ${name2}`;
            }
        }
        message += ` will be attending your 30th birthday!`;

        const waUrl = `https://wa.me/${phoneNum}?text=${encodeURIComponent(message)}`;
        window.open(waUrl, '_blank');
    }
</script>

</body>
</html>
