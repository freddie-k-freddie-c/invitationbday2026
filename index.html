            padding: 24px;

        .container {

        }

        .countdown {

        }

            align-items: center;
        }

        .time-value {

            font-weight: 300;
        }

        .time-unit {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-top: 4px;
        }

        /* Simplified RSVP Form */
        .rsvp-section {
            text-align: left;
        }

        .form-group {
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-color);
            outline: none;
            border-radius: 0;
            -webkit-appearance: none;
        }

        input[type="text"]:focus {
            border-color: var(--text-color);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--button-bg);
            background-color: transparent;
            color: var(--button-bg);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 0;
        }

        .btn-primary {
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
